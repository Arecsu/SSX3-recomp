# SSX 3 controls. Copy to keys.ini (next to tools\play.bat's working folder,
# the repo root) and change what you like; delete a line to keep its default.
# RECOMP_KEYS=<file> reads another file. The game log lists what was applied
# ([INPUT] lines).
#
# Keyboard (play.bat turns the keyboard on): <control> = <key>
#   keys: a letter or digit, Enter Space Backspace Tab Shift Ctrl Alt Esc
#   Up Down Left Right Home End PageUp PageDown Insert Delete Numpad0-9 F1-F12,
#   or a Windows virtual-key code as 0xNN. (Alt+Enter and F11 toggle fullscreen.)
up = Up
down = Down
left = Left
right = Right
start = Enter
back = Backspace
ls = Shift
rs = Ctrl
a = Z
b = X
x = A
y = S
black = E
white = Q
lt = 1
rt = 3
lstick_left = Numpad4
lstick_right = Numpad6
lstick_up = Numpad8
lstick_down = Numpad2
rstick_left = J
rstick_right = L
rstick_up = I
rstick_down = K

# Controller buttons: pad.<control> = <button>
#   buttons: up down left right start back ls rs a b x y lb rb lt rt
#   (the sticks are not remappable)
pad.black = lb
pad.white = rb
